<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club Sign Up</title>
    <style>
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 100px 20px 200px 20px;
            font-family: Arial, sans-serif;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        input[type="search"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .field {
            margin-left: 10px;
            margin-bottom: 15px;
        }
        .radio-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
<main> 
<form>
    <h2>Sign up for the Coding Club</h2>
    <p>Fill this out and we'll email you before the first meeting!</p>
<div class= "field">
    <label for= "search">Search Past Events:</label>
    <input type= "search" id = "search" name= "search">
</div>
<div class= "field">
    <label for= "fullname">Full Name:</label>
    <input type= "text" id = "fullname" name= "fullname" required>
</div>
<div class="row">
    <div class= "field">
        <label for= "email">Email:</label>
        <input type= "email" id = "email" name= "email" required>
        <label for= "phone">Phone:</label>
        <input type= "tel" id = "phone" name= "phone" required>
    </div>
</div>
<div class= "field">
    <label for="Major">Major:</label>
    <select id="Major" name="Major">
        <optgroup label="Engineering">
            <option value="electircal-engineering">Electrical Engineering</option>
            <option value="machanical-engineering">Mechanical Engineering</option>
        </optgroup>
        <optgroup label="Computer Science">
            <option value="computer-science">Computer Science</option>
            <option value="software-engineering">Software Engineering</option>
        </optgroup>
    </select>

</div>
</form>

</main>
</body>
</html>
